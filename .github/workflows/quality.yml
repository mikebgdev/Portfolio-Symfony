name: Quality
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash ci/check_secrets.sh
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      NUXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NUXT_PUBLIC_SUPABASE_KEY: placeholder-key
      NUXT_PUBLIC_DB_SCHEMA: public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: "8.2"
      - run: composer install --no-interaction && npm ci
      - run: bash ci/verify.sh
